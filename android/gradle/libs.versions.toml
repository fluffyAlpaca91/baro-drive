# Versions checked against maven-metadata.xml / official release notes on 2026-11-11.
# Newest stable releases unless a comment says otherwise.
#
# Gradle (gradle/wrapper/gradle-wrapper.properties) is 9.7.1, not 9.9.1: AGP 9.5 needs >= 9.6.0,
# KGP 2.4.21 is fully supported up to 9.7, and on 9.8+ AGP 9.5.1 and KSP 2.3.12 trigger
# Configuration.setVisible() deprecation warnings. Bump once AGP/KSP stop calling it.
[versions]
agp = "9.5.1"                     # needs Gradle >= 9.6.0, compileSdk max 37, Android Studio Rabbit 2 (2026.2.2)+
kotlin = "2.4.21"                 # KGP, compose compiler plugin, serialization plugin share this version
ksp = "2.3.12"                    # NOT 2.3.13: known-bad release (google/ksp#3286, breaks Hilt/Room in parallel builds)
hilt = "2.60.1"
androidx-hilt = "1.4.0"
compose-bom = "2026.09.00"        # Compose 1.12.1, Material3 1.4.0
activity-compose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.2"             # Navigation 2.x type-safe routes (not Navigation 3)
room = "2.8.5"
datastore = "1.3.0"
coroutines = "1.11.0"
serialization = "1.12.0"
core-ktx = "1.19.1"               # requires compileSdk 37 + AGP >= 9.1
junit = "4.13.2"
turbine = "1.2.1"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
pleos-vehicle = "2.3.2"           # 2.3.1 does not exist in the Pleos repo
pleos-navihelper = "3.0.5"
pleos-tts = "3.3.1"               # ON_DEVICE 한국어 음성 — 에뮬레이터의 플랫폼 TextToSpeech에는 한국어 엔진이 없다

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
# hiltViewModel() lives in hilt-lifecycle-viewmodel-compose since 1.3.0; the copy in
# hilt-navigation-compose (androidx.hilt.navigation.compose) is deprecated.
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidx-hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

junit = { module = "junit:junit", version.ref = "junit" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

pleos-vehicle = { module = "ai.pleos.playground:Vehicle", version.ref = "pleos-vehicle" }
pleos-navihelper = { module = "ai.pleos.playground:NaviHelper", version.ref = "pleos-navihelper" }
pleos-tts = { module = "ai.pleos.playground:TextToSpeech", version.ref = "pleos-tts" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# No kotlin-android plugin: AGP 9 compiles Kotlin itself (built-in Kotlin).
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
room = { id = "androidx.room", version.ref = "room" }
